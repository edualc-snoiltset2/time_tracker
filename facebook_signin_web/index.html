<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook - log in or sign up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1 class="logo">facebook</h1>
      <p class="tagline">
        Facebook helps you connect and share with the people in your life.
      </p>
    </section>

    <section class="login-panel">
      <form id="login-form" class="login-card" novalidate>
        <input
          type="text"
          id="email"
          name="email"
          class="field"
          placeholder="Email address or phone number"
          autocomplete="username"
        />
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="field"
            placeholder="Password"
            autocomplete="current-password"
          />
          <button type="button" id="toggle-password" class="toggle-password" aria-label="Show password">
            Show
          </button>
        </div>

        <p id="error" class="error" role="alert"></p>

        <button type="submit" class="btn btn-login">Log In</button>

        <a href="#" class="forgot-link" id="forgot-link">Forgotten password?</a>

        <hr class="divider" />

        <button type="button" class="btn btn-create" id="create-account">
          Create new account
        </button>
      </form>

      <p class="create-page">
        <strong>Create a Page</strong> for a celebrity, brand or business.
      </p>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-brand">Meta</p>
    <p class="footer-note">
      This is a UI clone for demonstration purposes only and is not affiliated
      with Meta or Facebook.
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
